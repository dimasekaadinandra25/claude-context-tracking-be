services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: claude_usage
      TZ: UTC
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d claude_usage"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${DB_PASSWORD:-postgres}
      PGDATABASE: claude_usage
      TZ: UTC
    volumes: ["./backups:/backups"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -o pipefail
        umask 077
        while true; do
          newest=$$(ls -t /backups/claude_usage-*.sql.gz 2>/dev/null | head -n 1)
          if [ -z "$$newest" ] || [ -n "$$(find "$$newest" -mmin +1440)" ]; then
            f=/backups/claude_usage-$$(date +%Y%m%d-%H%M%S).sql.gz
            if pg_dump --clean --if-exists | gzip > "$$f.tmp"; then
              mv "$$f.tmp" "$$f"
              echo "backup written: $$f"
              find /backups -name 'claude_usage-*.sql.gz' -mmin +20160 -delete
            else
              rm -f "$$f.tmp"
              echo "backup failed" >&2
            fi
          fi
          sleep 3600
        done
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ../claude-usage-dashboard
      args:
        VITE_SERVER_URL: ${PUBLIC_URL:-http://localhost:8080}
    ports: ["127.0.0.1:3000:80"]
    depends_on: [api]
    restart: unless-stopped

  reporter:
    build: ./reporter
    environment:
      REPORT_WEBHOOKS: ${REPORT_WEBHOOKS:-}
      REPORT_TIME: ${REPORT_TIME:-09:00}
      REPORT_TZ: ${REPORT_TZ:-Asia/Jakarta}
      REPORT_THEME: ${REPORT_THEME:-dark}
      REPORT_LOCALE: ${REPORT_LOCALE:-en-US}
      REPORT_LANG: ${REPORT_LANG:-en}
      REPORT_PUBLIC_API_URL: ${PUBLIC_URL:-http://localhost:8080}
      REPORT_LINK: ${PUBLIC_URL:-}
      REPORT_MESSAGE: ${REPORT_MESSAGE:-Claude usage report {date}}
      REPORT_EMAIL: ${REPORT_EMAIL:-}
      REPORT_PASSWORD: ${REPORT_PASSWORD:-}
      REPORT_ALERTS: ${REPORT_ALERTS-80,90,pace,summary,stale,runaway,project}
      REPORT_RUNAWAY_SHARE: ${REPORT_RUNAWAY_SHARE:-5}
      REPORT_PROJECT_SHARE: ${REPORT_PROJECT_SHARE:-40}
    volumes:
      - reporter-state:/state
    shm_size: 1gb
    init: true
    depends_on: [api, dashboard]
    restart: unless-stopped

  caddy:
    image: caddy:2.8-alpine
    profiles: [public]
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deployments/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [api, dashboard]
    restart: unless-stopped

volumes:
  pgdata:
  caddy-data:
  reporter-state:
